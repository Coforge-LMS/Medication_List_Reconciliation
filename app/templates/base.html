{% import "_icons.html" as icon %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MedRec{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css?v={{ version }}">
  <script src="/static/app.js?v={{ version }}" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">{{ icon.brand() }}MedRec</a>
    <nav aria-label="Main"><a href="/">Patients</a></nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>
    <div>MedRec {{ version }} · {{ disclaimer }}</div>
    <div class="attribution">{{ nlm_attribution }}</div>
  </footer>
</body>
</html>
