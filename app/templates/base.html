<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MedRec{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0 auto; max-width: 72rem; padding: 1rem; color: #1d1d1f; }
    header a { color: inherit; text-decoration: none; font-weight: 600; }
    table { border-collapse: collapse; width: 100%; margin: .5rem 0 1.5rem; }
    th, td { border-bottom: 1px solid #ddd; padding: .35rem .5rem; text-align: left; vertical-align: top; }
    th { background: #f5f5f7; }
    .columns { display: grid; grid-template-columns: repeat(auto-fit, minmax(16rem, 1fr)); gap: 1rem; }
    .muted { color: #6e6e73; }
    footer { margin-top: 2rem; padding-top: .75rem; border-top: 1px solid #ddd; font-size: .85rem; color: #6e6e73; }
  </style>
</head>
<body>
  <header><a href="/">MedRec</a></header>
  <main>{% block content %}{% endblock %}</main>
  <footer>
    <div>MedRec {{ version }}</div>
    <div>{{ disclaimer }}</div>
  </footer>
</body>
</html>
