<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MedRec{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css?v={{ version }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">MedRec</a>
    <span class="tagline">Medication list reconciliation</span>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer>
    <div>MedRec {{ version }}</div>
    <div>{{ disclaimer }}</div>
  </footer>
</body>
</html>
