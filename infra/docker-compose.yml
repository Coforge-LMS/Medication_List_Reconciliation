services:
  hapi-db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hapi
      POSTGRES_DB: hapi
      POSTGRES_PASSWORD: ${HAPI_DB_PASSWORD:?set HAPI_DB_PASSWORD in .env}
    volumes:
      - hapi-db-data:/var/lib/postgresql
    healthcheck: &postgres-health
      # TCP avoids passing against the temporary socket-only initdb server.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  hapi:
    image: hapiproject/hapi:v8.12.0-2
    restart: unless-stopped
    depends_on:
      hapi-db:
        condition: service_healthy
    # TEA-42 owns these non-secret datasource/driver/dialect/JVM settings.
    env_file:
      - ./hapi.env
    environment:
      SPRING_DATASOURCE_USERNAME: hapi
      SPRING_DATASOURCE_PASSWORD: ${HAPI_DB_PASSWORD:?set HAPI_DB_PASSWORD in .env}
    mem_limit: 2g
    healthcheck:
      # The distroless image supplies this Java probe, but no shell or curl.
      test: ["CMD", "java", "-cp", "/app", "HealthCheck"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    ports:
      - "127.0.0.1:${HAPI_PORT:-8080}:8080"

  importer:
    image: python:3.12.16-slim-trixie
    restart: "no"
    depends_on:
      hapi:
        condition: service_healthy
    environment:
      HAPI_BASE_URL: http://hapi:8080/fhir
      FHIR_DATA_DIR: /data/fhir
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - type: bind
        source: ./import_fhir.py
        target: /opt/medrec/import_fhir.py
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../data/fhir
        target: /data/fhir
        read_only: true
        bind:
          create_host_path: false
    command: ["python", "/opt/medrec/import_fhir.py"]

  app-db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: medrec
      POSTGRES_DB: medrec
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      - app-db-data:/var/lib/postgresql
    healthcheck: *postgres-health
    ports:
      - "127.0.0.1:${APP_DB_PORT:-5433}:5432"

  app-seed:
    # Same locally built image as app; release startup never rebuilds it.
    image: medrec-app:${APP_VERSION:?set APP_VERSION in .env}
    pull_policy: never
    restart: "no"
    depends_on:
      app-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://medrec:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@app-db:5432/medrec
    command: ["python", "-m", "db.seed", "data/intake"]
    healthcheck:
      disable: true

  app:
    image: medrec-app:${APP_VERSION:?set APP_VERSION in .env}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      app-db:
        condition: service_healthy
      importer:
        condition: service_completed_successfully
      app-seed:
        condition: service_completed_successfully
    # Deliberately explicit: the app receives only its own DB credentials.
    environment:
      DATABASE_URL: postgresql+psycopg://medrec:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@app-db:5432/medrec
      FHIR_BASE_URL: http://hapi:8080/fhir
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"

volumes:
  hapi-db-data:
  app-db-data:
