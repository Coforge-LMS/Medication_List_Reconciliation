name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.24"
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Validate release entry points
        run: |
          bash -n scripts/build_release.sh scripts/backup.sh
          APP_VERSION=1.0.0 docker compose --env-file .env.example -f compose.release.yaml config --quiet

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: medrec
          POSTGRES_PASSWORD: medrec
          POSTGRES_DB: medrec_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medrec -d medrec_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://medrec:medrec@localhost:5432/medrec_test
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.24"
          python-version: "3.12"
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked
      
      - name: Verify Postgres connection
        run: |
          uv run --locked python - <<'PY'
          import os
          from sqlalchemy import create_engine, text

          engine = create_engine(os.environ["TEST_DATABASE_URL"])
          try:
              with engine.connect() as connection:
                  assert connection.scalar(text("SELECT 1")) == 1
                  assert connection.scalar(text("SELECT current_database()")) == "medrec_test"
          finally:
              engine.dispose()
          PY
      - name: Run tests
        run: uv run --locked pytest -vv --durations=10
